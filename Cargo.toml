[package]
name = "abcom"
version = "0.0.1"
edition = "2021"
description = "P2P LAN chat with automatic peer discovery and native GUI"
license = "MIT"
repository = "https://github.com/rxdy/abcom"

[[bin]]
name = "abcom"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "io-util",
    "fs",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["image", "http", "gif", "webp"] }
ehttp = "0.5"
chrono = "0.4"
anyhow = "1"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = "0.15"
walkdir = "2"
socket2 = { version = "0.5", features = ["all"] }
resvg = { version = "0.47.0", optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
snow = "0.10.0"
blake2 = "0.10.6"
tray-icon = "0.24.1"
notify-rust = "4.18.0"
auto-launch = "0.6.0"

[features]
default = []
# Import d'un avatar SVG (rasterisation via resvg — dépendance lourde,
# désactivée par défaut : binaire et compilation nettement plus légers).
avatar-svg = ["dep:resvg"]

[target.'cfg(windows)'.dependencies]
rodio = { version = "0.19", default-features = false, features = ["symphonia-wav"] }

[target.'cfg(not(windows))'.dependencies]
rodio = { version = "0.19", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# Bascule Dock/Accessory quand la fenêtre est repliée dans la barre de menus
# (versions alignées sur celles déjà présentes via tray-icon/winit).
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSThread", "NSData"] }
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSImage",
] }

# Binaire compact et rapide : LTO inter-crates, une seule unité de codegen,
# symboles retirés, pas de tables de déroulement de panique.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
