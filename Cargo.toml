[package]
name = "abcom"
version = "0.0.1"
edition = "2021"
description = "P2P LAN chat with automatic peer discovery and native GUI"
license = "MIT"
repository = "https://github.com/rxdy/abcom"

[[bin]]
name = "abcom"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["image", "http", "gif", "webp"] }
ehttp = "0.5"
chrono = "0.4"
anyhow = "1"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = "0.15"
walkdir = "2"
socket2 = { version = "0.5", features = ["all"] }
resvg = "0.47.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
rodio = { version = "0.19", default-features = false, features = ["symphonia-wav"] }

[target.'cfg(not(windows))'.dependencies]
rodio = { version = "0.19", default-features = false }
