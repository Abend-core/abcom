[package]
name = "abcom"
version = "1.0.0-beta.1"
edition = "2021"
# MSRV vérifiée en CI (job `msrv`). Contrainte imposée par la chaîne de
# dépendances, pas par le code d'abcom : le build script de `libsqlite3-sys`
# (via rusqlite 0.40) exige le dernier stable — 1.94 et antérieurs échouent.
# À réévaluer à chaque montée de rusqlite : elle pourra redescendre.
rust-version = "1.95"
description = "P2P LAN chat with automatic peer discovery and native GUI"
# La licence de référence est le fichier LICENSE (texte intégral) et ce que
# l'onglet Licence de l'application affiche : AGPL-3.0. `MIT` déclaré ici
# jusqu'au 8 août 2026 était une incohérence, pas une double licence.
license = "AGPL-3.0-only"
repository = "https://github.com/Abend-core/abcom"

[[bin]]
name = "abcom"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "io-util",
    "fs",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Renderer wgpu (Metal natif sur macOS, Vulkan/DX12 ailleurs) au lieu de Glow :
# OpenGL est déprécié sur macOS et y est émulé au-dessus de Metal, au prix d'un
# contexte GPU d'une quarantaine de Mo pour une UI 2D. La feature `glow` est
# retirée des features par défaut : le renderer OpenGL d'egui (`egui_glow`)
# n'est plus lié. La crate `glow` reste compilée sur Windows et Linux — c'est
# le backend GLES interne de wgpu, via `wgpu-hal` ; il ne sert que de repli et
# n'existe pas sur macOS.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image", "http", "gif", "webp"] }
ehttp = "0.7"
chrono = "0.4"
anyhow = "1"
dirs = "6"
# `bmp` fait partie des extensions traitées comme images (cf.
# `MediaAttachment::is_image_filename`) : sans le décodeur, ces fichiers
# s'affichaient en vignette cassée au lieu de s'ouvrir.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.17"
walkdir = "2"
socket2 = { version = "0.6", features = ["all"] }
resvg = { version = "0.48", optional = true }
# Un seul backend deflate : la feature `deflate` tire aussi zopfli, qui
# n'est jamais exercé au niveau de compression par défaut.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
snow = "0.10.0"
# Signature des annonces de découverte (clé dérivée de l'identité Noise).
ed25519-dalek = "3"
blake2 = "0.10.6"
# Sons de notification : seule la lecture est utilisée (tonalités
# synthétisées), aucun décodeur de format n'est nécessaire.
rodio = { version = "0.22", default-features = false, features = ["playback"], optional = true }
tray-icon = { version = "0.24.1", optional = true }
notify-rust = "4.18.0"
auto-launch = "0.6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
# Journal fichier : sur un binaire release sans console, le hook de panique
# donne la cause d'un crash mais rien de ce qui l'a précédé.
tracing-appender = "0.2"
# HWND natif (via eframe::Frame) pour replier la fenêtre dans le tray sous
# Windows sans la détruire (déplacement hors écran + style « outil »).
raw-window-handle = "0.6"
# Allocateur global : l'allocateur système ne rend pas les pages libérées à
# l'OS (24 % de fragmentation mesurée), si bien que le repli dans le tray ne
# faisait pas baisser le RSS malgré la libération des textures. mimalloc rend
# la mémoire et expose un `purge` explicite, déclenché au repli.
mimalloc = "0.1"
# Accès direct à `mi_collect` : rendre les pages à l'OS au repli dans le tray.
libmimalloc-sys = { version = "0.1", features = ["extended"] }

[dev-dependencies]
# Test d'interface réel : pilote les widgets via AccessKit (clics, frappe).
egui_kittest = "0.36"
egui = "0.36"

[features]
default = ["tray", "sound"]
# Icône résidente. Tire GTK3 + libappindicator sur Linux : la désactiver permet
# de compiler sur un système qui n'a pas ces en-têtes (conteneur, Alpine/musl,
# poste sans bureau). Sans elle, fermer la fenêtre quitte l'application.
tray = ["dep:tray-icon"]
# Son de notification. Tire ALSA (`libasound2-dev`) sur Linux, pour deux
# tonalités synthétisées : la désactiver retire le bip, rien d'autre.
sound = ["dep:rodio"]
# Import d'un avatar SVG (rasterisation via resvg — dépendance lourde,
# désactivée par défaut : binaire et compilation nettement plus légers).
avatar-svg = ["dep:resvg"]

[target.'cfg(windows)'.dependencies]
# Replier la fenêtre dans le tray sans la détruire : on la sort de l'écran et
# de la barre des tâches (style « outil ») tout en la gardant « visible » pour
# Windows, afin que la boucle egui continue de tourner (tray + notifications).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Bascule Dock/Accessory quand la fenêtre est repliée dans la barre de menus
# (versions alignées sur celles déjà présentes via tray-icon/winit).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSThread", "NSData"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSImage",
] }

# Binaire compact et rapide : LTO inter-crates, une seule unité de codegen,
# symboles retirés, pas de tables de déroulement de panique.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
