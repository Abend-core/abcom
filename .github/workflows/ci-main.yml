name: CI — main

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  full-check:
    name: Format · Lint · Build · Tests · Intégration · Audit sécurité
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --check

      - name: Lint (warnings = errors)
        run: cargo clippy -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Tests unitaires
        run: cargo test

      - name: Tests d'intégration
        run: bash scripts/integration_test.sh

      - name: Audit sécurité dépendances
        run: |
          cargo install cargo-audit --quiet
          cargo audit
