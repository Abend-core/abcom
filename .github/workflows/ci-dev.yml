name: CI — dev

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format · Lint · Build · Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Lint (warnings = errors)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build release
        run: cargo build --release --locked

      - name: Tests unitaires
        run: cargo test --all-features --locked

  supply-chain:
    name: Audit dépendances (vulnérabilités · licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Binaires pré-compilés : plus de `cargo install` de plusieurs minutes
      # à chaque exécution (l'ancienne CI `main` réinstallait cargo-audit sans
      # cache à chaque run).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Vulnérabilités connues (RUSTSEC)
        run: cargo audit

      - name: Licences et sources des dépendances
        run: cargo deny check licenses sources bans

  coverage:
    name: Couverture de tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Mesure
        run: cargo llvm-cov --all-features --locked --summary-only

  msrv:
    name: MSRV (rust-version de Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Lire la MSRV déclarée
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Compile avec la MSRV déclarée
        run: cargo check --all-targets --all-features --locked

  minimal-build:
    name: Build minimal (sans GTK ni ALSA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Volontairement aucune dépendance système : c'est tout l'intérêt du
      # test. Si `--no-default-features` réclamait encore GTK, libappindicator
      # ou ALSA, ce job échouerait — et la compatibilité annoncée pour les
      # systèmes minimaux (conteneur, Alpine/musl) serait fausse.
      - name: Dépendances système (clavier/fenêtrage uniquement)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Compile et teste sans tray ni son
        run: |
          cargo check --all-targets --no-default-features --locked
          cargo test --no-default-features --locked

  platform-check:
    name: Check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-targets --all-features --locked
